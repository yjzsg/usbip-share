# The project name and container name are pinned so neither depends on the
# directory this repository happens to be checked out into.
name: usbip-share-server

services:
  usbip-server:
    container_name: usbip-share-server
    build:
      context: .
      dockerfile: Dockerfile
    image: local/usbip-share-server:2.1
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      USBIP_PORT: ${USBIP_PORT:-5555}
      # Optional initial list; devices can also be shared from the Chinese UI.
      # Example: 1-1 or 1-1,1-2.3.
      USBIP_BUSIDS: ${USBIP_BUSIDS:-}
      USBIP_LOAD_MODULE: ${USBIP_LOAD_MODULE:-true}
      USBIP_UNBIND_ON_EXIT: ${USBIP_UNBIND_ON_EXIT:-false}
      USBIPD_DEBUG: ${USBIPD_DEBUG:-false}
      USBIP_WEB_ENABLED: ${USBIP_WEB_ENABLED:-true}
      USBIP_WEB_HOST: ${USBIP_WEB_HOST:-0.0.0.0}
      USBIP_WEB_PORT: ${USBIP_WEB_PORT:-8080}
      # Set a non-empty token before exposing the management UI beyond localhost.
      USBIP_WEB_TOKEN: ${USBIP_WEB_TOKEN:-}
      # Leave empty to let the container generate a random first-start password
      # (written to ./config/initial-password.txt, must be changed on first
      # login). Set it to manage the admin password from the environment.
      USBIP_WEB_PASSWORD: ${USBIP_WEB_PASSWORD:-}
      # 共享访问密码(访问控制)。留空 = 关闭,行为与旧版完全一致(默认)。
      # 设置后:客户端必须先用密码调 /api/access/authorize 换取源 IP 授权,
      # 之后它的 USB/IP 数据连接才会被网关放行(授权有效期见 TTL)。
      USBIP_ACCESS_PASSWORD: ${USBIP_ACCESS_PASSWORD:-}
      # 授权有效期(秒),默认 12 小时;客户端每拍心跳都会续期。
      USBIP_ACCESS_TTL_SECONDS: ${USBIP_ACCESS_TTL_SECONDS:-43200}
      # 授权表路径:web.py 写、gateway.py 读。文件存在 = 访问控制开启。
      USBIP_ACCESS_FILE: ${USBIP_ACCESS_FILE:-/run/usbip/authorized-clients.json}
      # Listen address of the single external port (USB/IP + management UI).
      USBIP_GATEWAY_HOST: ${USBIP_GATEWAY_HOST:-0.0.0.0}
      USBIP_METADATA_FILE: ${USBIP_METADATA_FILE:-/etc/usbip/device-metadata.json}
      USBIP_CLIENTS_FILE: ${USBIP_CLIENTS_FILE:-/run/usbip/clients.json}
      # Release a shared device when its client stops heartbeating this long.
      # Default 60s; our Chinese client heartbeats every 10s.
      USBIP_KICK_IDLE_SECONDS: ${USBIP_KICK_IDLE_SECONDS:-60}
      # A client is declared gone only after this many *consecutive* watchdog
      # cycles (~50s at the defaults) without a heartbeat, so one dropped
      # heartbeat cannot force-release a device that is still in use.
      USBIP_HEARTBEAT_INTERVAL_SECONDS: ${USBIP_HEARTBEAT_INTERVAL_SECONDS:-10}
      USBIP_WATCHDOG_MISSED_RUNS: ${USBIP_WATCHDOG_MISSED_RUNS:-5}
      # Pending-attach queue (waitlist) and its one-shot notifications.
      USBIP_QUEUE_FILE: ${USBIP_QUEUE_FILE:-/run/usbip/queue.json}
      USBIP_NOTIFY_FILE: ${USBIP_NOTIFY_FILE:-/run/usbip/queue-notify.json}

    ports:
      # Phase B(单端口):对外只开一个端口,USB/IP 与 管理接口/网页 共用。
      - "${USBIP_HOST_BIND:-0.0.0.0}:${USBIP_HOST_PORT:-5555}:${USBIP_PORT:-5555}/tcp"
      # 旧版需要单独的管理端口;新版本已不需要。若仍想直接访问容器内网页
      # (http://NAS:5555 已可访问同一网页),可取消下面这行的注释并按需改端口:
      # - "${USBIP_WEB_HOST_BIND:-127.0.0.1}:${USBIP_WEB_HOST_PORT:-18080}:${USBIP_WEB_PORT:-8080}/tcp"

    # usbip-host is a host-kernel driver. The module and USB device nodes
    # must be visible to this container; privileged is intentionally explicit.
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /lib/modules:/lib/modules:ro
      # Device names/remarks are persisted here; this mount must be writable.
      - ./config:/etc/usbip
      # Bind-mount the two UI files instead of baking them into the image, so a
      # web.py / index.html change ships with `docker compose up -d` and does
      # not need a rebuild (image rebuilds are blocked on networks where the
      # registry accelerator answers 401).
      - ./web.py:/opt/usbip-share/web.py:ro
      - ./index.html:/opt/usbip-share/index.html:ro
      # gateway.py 同理:共享访问密码要靠它拦住未授权的 USB/IP 连接,不 bind
      # mount 的话改了 gateway.py 必须重建镜像才生效。
      - ./gateway.py:/opt/usbip-share/gateway.py:ro
      # 与客户端 exe / 安装包同源的图标（浏览器标签页 + 页面 logo）。
      - ./favicon.ico:/opt/usbip-share/favicon.ico:ro

    healthcheck:
      test: ["CMD", "/usr/local/bin/usbip-share-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
