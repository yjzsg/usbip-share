<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USB-SHARE 设备共享</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --card: #fff;
      --card-2: #fbfcfe;
      --text: #182230;
      --muted: #667085;
      --line: #e4e9f0;
      --brand: #1769e0;
      --brand-dark: #0d4eaf;
      --brand-bg: #edf3ff;
      --green: #087443;
      --green-bg: #e7f7ef;
      --gray-bg: #f0f2f5;
      --red: #b42318;
      --red-bg: #fff0ee;
      --warn: #b54708;
      --warn-bg: #fff4e5;
      --hover: #f7f9fd;
      --radius: 14px;
      --radius-sm: 9px;
      --shadow: 0 10px 30px rgba(28, 45, 75, .08);
      --shadow-sm: 0 2px 8px rgba(28, 45, 75, .06);
    }
    /* 深色模式：飞牛桌面支持深色主题，页面跟随系统设置，不再写死浅色。 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141c;
        --card: #171e29;
        --card-2: #1b2331;
        --text: #e6ebf2;
        --muted: #93a1b5;
        --line: #26303f;
        --brand: #5b9bff;
        --brand-dark: #8bbcff;
        --brand-bg: #1b2a44;
        --green: #5fd39b;
        --green-bg: #12291f;
        --gray-bg: #202836;
        --red: #ff9b91;
        --red-bg: #331c1b;
        --warn: #ffbd6b;
        --warn-bg: #33260f;
        --hover: #1d2634;
        --shadow: 0 10px 30px rgba(0, 0, 0, .4);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 1560px; margin: 0 auto; padding: 28px 18px 48px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: #fff; background: linear-gradient(135deg, #24304f, #16203a); font-size: 10px; font-weight: 700; letter-spacing: .2px; box-shadow: 0 6px 14px rgba(22, 32, 58, .3); }
    .logo img { width: 30px; height: 30px; display: block; border-radius: 7px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: .2px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .toolbar { padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .count { color: var(--muted); }
    .port { color: var(--muted); }
    button { border: 0; border-radius: var(--radius-sm); min-height: 36px; padding: 8px 14px; cursor: pointer; font: inherit; font-weight: 500; transition: background .15s ease, transform .15s ease; white-space: nowrap; }
    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    .primary { background: var(--brand); color: #fff; }
    .primary:hover { background: var(--brand-dark); }
    .secondary { background: var(--brand-bg); color: var(--brand-dark); }
    /* 被隐藏的设备：默认不出现在列表里，勾选「显示出来」后才以淡色显示。 */
    .hidden-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; padding: 8px 0; }
    tr.row-hidden td { opacity: .55; }
    .badge.hidden-badge { background: var(--gray-bg); color: var(--muted); }
    .badge.net-badge { color: var(--warn); background: var(--warn-bg); }
    .danger { background: var(--red-bg); color: var(--red); }
    .table-wrap { overflow: auto; max-height: min(62vh, 860px); scrollbar-width: thin; }
    /* min-width 必须小于 .wrap 的 max-width，否则表格一定横向溢出、最右边的
       「操作」列会被裁掉（之前是 1460 > 1400）。这里按"最窄也要能看"来定，
       真正的兜底是下面把操作列钉在右侧。 */
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 900px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
    /* 表头吸顶：设备多的时候滚动列表不会丢掉列名。 */
    thead th { position: sticky; top: 0; z-index: 3; color: var(--muted); font-weight: 600; background: var(--card-2); font-size: 13px; }
    tbody tr:hover td { background: var(--hover); }
    /* 操作列固定在右侧：窗口再窄，按钮也不会被裁到看不见。 */
    th:last-child, td:last-child { position: sticky; right: 0; z-index: 2; background: var(--card); }
    thead th:last-child { z-index: 4; background: var(--card-2); }
    tbody tr:hover td:last-child { background: var(--hover); }
    th:last-child::before, td:last-child::before { content: ''; position: absolute; top: 0; bottom: 0; left: -10px; width: 10px; pointer-events: none; background: linear-gradient(to right, rgba(28, 45, 75, 0), rgba(28, 45, 75, .07)); }
    tbody tr:last-child td { border-bottom: 0; }
    .device-name { font-weight: 600; max-width: 260px; word-break: break-word; }
    .device-sub { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
    .remark { color: var(--muted); max-width: 220px; white-space: pre-wrap; word-break: break-word; }
    .muted { color: var(--muted); }
    code { background: var(--gray-bg); padding: 2px 6px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 9px; font-size: 12px; white-space: nowrap; }
    .badge.shared { color: var(--green); background: var(--green-bg); }
    .badge.free { color: var(--muted); background: var(--gray-bg); }
    .bind { display: inline-block; border-radius: 6px; padding: 3px 8px; font-size: 12px; white-space: nowrap; }
    .bind-serial { color: var(--green); background: var(--green-bg); }
    .bind-model { color: var(--brand-dark); background: var(--brand-bg); }
    .bind-group { color: var(--warn); background: var(--warn-bg); }
    .bind-legacy, .bind-none { color: var(--muted); background: var(--gray-bg); }
    .warn-text { color: var(--warn); }
    .owner { max-width: 210px; word-break: break-word; }
    .owner strong { display: block; }
    .owner small { color: var(--muted); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions button { padding: 7px 10px; font-size: 13px; }
    .empty, .error { padding: 48px 18px; text-align: center; color: var(--muted); }
    .error { color: var(--red); }
    .bottom { margin-top: 16px; color: var(--muted); font-size: 12px; }
    .bottom p { margin: 0; }
    .access-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .access-row:last-child { border-bottom: 0; }
    .access-row small { display: block; color: var(--muted); font-size: 12px; }
    .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: rgba(15, 23, 42, .45); }
    .modal[hidden] { display: none; }
    .center-card { width: min(430px, 100%); padding: 26px; text-align: center; }
    .center-card h2 { margin: 0 0 8px; font-size: 21px; }
    .center-card p { color: var(--muted); margin: 0 0 18px; }
    .field { margin-bottom: 14px; text-align: left; }
    .field label { display: block; color: var(--muted); margin-bottom: 6px; }
    .field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
    .editor { width: min(600px, 100%); padding: 22px; }
    .editor h2 { margin: 0 0 16px; font-size: 19px; }
    .editor-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    /* 概览压成一行状态条：下面那张设备表才是主要信息，这里只供一眼扫过。 */
    .statbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 26px; padding: 11px 18px; margin-bottom: 14px; }
    .stat { display: inline-flex; align-items: baseline; gap: 7px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stat strong { font-size: 17px; line-height: 1.3; font-variant-numeric: tabular-nums; }
    /* 访问控制那格是文字状态 + 一个入口，字号跟标签对齐即可。 */
    .stat-access strong { font-size: 13px; font-weight: 600; }
    .link-btn { min-height: 26px; padding: 2px 9px; font-size: 12px; background: var(--brand-bg); color: var(--brand-dark); }
    .filters { padding: 16px 18px; display: flex; align-items: flex-end; gap: 14px; border-bottom: 1px solid var(--line); }
    .search-field { flex: 1 1 320px; max-width: 460px; }
    .filter-field { flex: 0 0 150px; }
    .filters label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .filters input, .filters select { width: 100%; min-height: 39px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; background: var(--card); color: var(--text); font: inherit; }
    /* 筛选开关做成按钮而不是复选框：按下态直接填充品牌色，一眼能看出开没开。 */
    .chip { min-height: 39px; padding: 8px 14px; background: var(--gray-bg); color: var(--muted); border: 1px solid transparent; }
    .chip:hover { background: var(--brand-bg); color: var(--brand-dark); }
    .chip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
    .chip[aria-pressed="true"]:hover { background: var(--brand-dark); color: #fff; }
    .error-banner { margin-bottom: 18px; padding: 12px 16px; display: flex; gap: 16px; align-items: center; justify-content: space-between; color: var(--red); border-color: #f4c4be; }
    .feedback { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px); padding: 12px 20px; border-radius: 10px; color: #fff; background: #1f2937; box-shadow: var(--shadow); }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } button:hover { transform: none; } }
    /* 飞牛小窗通常比全屏窄：先收起「名称绑定依据」这一列（信息量最低），
       再把内边距压紧。操作列本来就钉在右侧，所以按钮始终可见。 */
    @media (max-width: 1180px) {
      th:nth-child(3), td:nth-child(3) { display: none; }
      th, td { padding: 10px; }
      .statbar { gap: 4px 18px; padding: 10px 14px; }
    }
    @media (max-width: 900px) { .filters { flex-wrap: wrap; } }
    @media (max-width: 650px) {
      .search-field { max-width: none; }
      .filter-field { flex: 1; }
      .error-banner { align-items: flex-start; }
      .wrap { padding-top: 20px; }
      .top { align-items: flex-start; flex-direction: column; }
      h1 { font-size: 21px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="wrap" id="mainApp" hidden>
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><img src="favicon.ico" alt=""></div>
        <div>
          <h1>USB-SHARE</h1>
        </div>
      </div>
      <div>
        <!-- 密码由 USBIP_WEB_PASSWORD 环境变量托管时（飞牛应用的默认形态），
             这一项由 applyPasswordManaged() 保持隐藏：页面上改不了，就别给入口。 -->
        <button class="secondary" id="changePassBtn" hidden>修改密码</button>
        <button class="secondary" id="logoutBtn">退出登录</button>
        <button class="primary" id="refreshTop">刷新设备</button>
      </div>
    </header>

    <section class="card statbar" aria-label="设备概览">
      <div class="stat"><span>设备总数</span><strong id="totalCount">—</strong></div>
      <div class="stat"><span>正在共享</span><strong id="sharedCount">—</strong></div>
      <div class="stat"><span>已登记连接</span><strong id="connectedCount">—</strong></div>
      <div class="stat stat-access">
        <span>访问控制</span>
        <strong id="accessState">—</strong>
        <button class="link-btn" id="accessManageBtn">管理</button>
      </div>
    </section>

    <div id="errorBanner" class="card error-banner" role="alert" hidden>
      <span id="errorText"></span><button class="secondary" id="retryBtn">重试连接</button>
    </div>
    <p id="feedback" class="feedback" role="status" hidden></p>

    <section class="card devices-card">
      <div class="toolbar">
        <div class="toolbar-left">
          <strong>本机 USB 设备</strong>
          <span class="count" id="count">正在读取…</span>
          <span class="port">USB/IP 服务端口：<code id="port">5555</code></span>
        </div>
        <span id="updated" class="count"></span>
      </div>
      <div class="filters">
        <div class="search-field">
          <label for="deviceSearch">搜索设备</label>
          <input id="deviceSearch" type="search" placeholder="名称、备注、Bus ID、连接方或排队方" autocomplete="off">
        </div>
        <div class="filter-field">
          <label for="statusFilter">设备状态</label>
          <select id="statusFilter">
            <option value="all">全部状态</option>
            <option value="shared">已共享</option>
            <option value="unshared">未共享</option>
            <option value="connected">已登记连接</option>
          </select>
        </div>
        <button class="chip" id="showHidden" type="button" aria-pressed="false"
                title="把已隐藏的设备也列出来">已隐藏设备</button>
        <button id="clearFilters" class="secondary" hidden>清除筛选</button>
      </div>
      <div id="content" class="table-wrap" tabindex="0" aria-label="USB 设备列表">
        <div class="empty">正在读取 USB 设备…</div>
      </div>
    </section>

    <div class="bottom">
      <p>客户端停止心跳超过 <strong id="kickIdle">—</strong> 后自动释放其设备。</p>
    </div>
  </main>

  <div class="modal" id="loginModal" hidden>
    <section class="card center-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <h2 id="loginTitle">USB-SHARE 设备共享</h2>
      <p>请输入管理密码登录</p>
      <div class="field">
        <label for="loginPass">管理密码</label>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="请输入管理密码">
      </div>
      <button class="primary" id="loginBtn" style="width:100%">登录</button>
      <p class="muted" style="margin-top:14px;font-size:12px">密码可在「应用设置」里修改</p>
    </section>
  </div>

  <div class="modal" id="changeModal" hidden>
    <section class="card center-card" role="dialog" aria-modal="true" aria-labelledby="changeTitle">
      <h2 id="changeTitle">修改管理密码</h2>
      <p id="changeHint">请设置新的管理密码。</p>
      <div class="field">
        <label for="oldPass">当前密码</label>
        <input id="oldPass" type="password" autocomplete="current-password">
      </div>
      <div class="field">
        <label for="newPass">新密码（至少 6 位）</label>
        <input id="newPass" type="password" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="newPass2">确认新密码</label>
        <input id="newPass2" type="password" autocomplete="new-password">
      </div>
      <button class="primary" id="changeBtn" style="width:100%">保存新密码</button>
    </section>
  </div>

  <div class="modal" id="editorModal" hidden>
    <section class="card editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <h2 id="editorTitle">编辑设备名称和备注</h2>
      <div class="field">
        <label for="aliasInput">显示名称（可选）</label>
        <input id="aliasInput" maxlength="80" placeholder="例如：财务加密狗、张三专用">
      </div>
      <div class="field">
        <label for="remarkInput">设备备注（可选）</label>
        <textarea id="remarkInput" maxlength="500" style="width:100%;min-height:100px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;resize:vertical" placeholder="例如：连接财务电脑使用，不要拔出"></textarea>
      </div>
      <div class="editor-actions">
        <button class="secondary" id="cancelEdit">取消</button>
        <button class="primary" id="saveEdit">保存</button>
      </div>
    </section>
  </div>

  <div class="modal" id="accessModal" hidden>
    <section class="card editor" role="dialog" aria-modal="true" aria-labelledby="accessTitle">
      <h2 id="accessTitle">已授权的客户端</h2>
      <div id="accessList"></div>
      <div class="editor-actions">
        <button class="secondary" id="accessRevokeAll">吊销全部</button>
        <button class="primary" id="accessClose">关闭</button>
      </div>
    </section>
  </div>

  <script>
    const TOKEN_KEY = 'usbip-share-token';
    // 项目改名前的旧键名，仅用于一次性迁移；迁移完即删除。
    const LEGACY_TOKEN_KEY = 'fnos-usbip-token';
    let token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem(LEGACY_TOKEN_KEY) || '';
    if (token) localStorage.setItem(TOKEN_KEY, token);
    localStorage.removeItem(LEGACY_TOKEN_KEY);
    let mustChange = false;
    // true = 密码由服务端 USBIP_WEB_PASSWORD 托管：页面隐藏「修改密码」入口，
    // 也不再强制弹改密框（在页面上改了下次重启也会被环境变量覆盖）。
    let passwordManaged = false;
    // true = 列表里连「已隐藏的设备」一起显示（服务端只在带管理员令牌 +
    // includeHidden=1 时才返回它们）。隐藏是给 USB 网卡这类"绝对不能被共享"
    // 的设备准备的：默认从列表里消失，Windows 客户端也看不到，也就点不到。
    let showHidden = false;

    /*
     * 这个页面有两种访问方式：
     *   1. 直连服务端口：http://NAS:端口/              前缀为空
     *   2. 飞牛统一网关（桌面小窗）：/app/usbip-share/  前缀非空
     * 下面的 /api/* 都是根路径写法，走网关时会打到 NAS 域名的 /api 上而不是本应用。
     * 这里按当前路径算出挂载前缀并统一补上，避免改每一处 fetch。
     * 前缀本身来自飞牛入口配置里的 gatewayPrefix，改 appname 时这里要一起改。
     */
    const GATEWAY_PREFIX = (() => {
      const marker = '/app/usbip-share';
      const path = window.location.pathname || '/';
      return (path === marker || path.startsWith(marker + '/')) ? marker : '';
    })();
    if (GATEWAY_PREFIX) {
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        if (typeof input === 'string' && input.startsWith('/api/')) {
          return nativeFetch(GATEWAY_PREFIX + input, init);
        }
        return nativeFetch(input, init);
      };
    }

    const mainApp = document.getElementById('mainApp');
    const loginModal = document.getElementById('loginModal');
    const changeModal = document.getElementById('changeModal');
    const editorModal = document.getElementById('editorModal');
    const aliasInput = document.getElementById('aliasInput');
    const remarkInput = document.getElementById('remarkInput');
    let editingBusId = '';
    let currentDevices = [];
    let hasDevices = false;
    let loadingDevices = false;
    let checkingSession = false;
    let sessionReady = false;
    let pendingRefresh = false;
    let renderedHtml = '';
    let flashTimer;
    const content = document.getElementById('content');
    const searchInput = document.getElementById('deviceSearch');
    const statusFilter = document.getElementById('statusFilter');
    const refreshButton = document.getElementById('refreshTop');

    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('changeBtn').onclick = doChange;
    document.getElementById('changePassBtn').onclick = () => showChange();
    // 被隐藏的设备默认不列出来；这个按钮是开关，按下时把 includeHidden=1 带上。
    document.getElementById('showHidden').onclick = () => {
      showHidden = !showHidden;
      const toggle = document.getElementById('showHidden');
      toggle.setAttribute('aria-pressed', String(showHidden));
      renderedHtml = '';
      loadDevices({force: true});
    };
    document.getElementById('logoutBtn').onclick = () => {
      token = ''; localStorage.removeItem(TOKEN_KEY);
      window.location.reload();
    };
    refreshButton.onclick = () => sessionReady ? loadDevices() : bootstrap();
    document.getElementById('retryBtn').onclick = () => sessionReady ? loadDevices() : bootstrap();
    document.getElementById('cancelEdit').onclick = closeEditor;
    editorModal.onclick = e => { if (e.target === editorModal) closeEditor(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditor(); });
    document.getElementById('saveEdit').onclick = saveMetadata;
    searchInput.addEventListener('input', () => renderDevices(currentDevices));
    statusFilter.addEventListener('change', () => renderDevices(currentDevices));
    document.getElementById('clearFilters').onclick = () => {
      searchInput.value = '';
      statusFilter.value = 'all';
      renderDevices(currentDevices);
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function flash(message) {
      const feedback = document.getElementById('feedback');
      clearTimeout(flashTimer);
      feedback.textContent = message;
      feedback.hidden = false;
      flashTimer = setTimeout(() => { feedback.hidden = true; }, 3500);
    }
    function setError(message) {
      document.getElementById('errorBanner').hidden = !message;
      document.getElementById('errorText').textContent = message;
    }
    function expireSession() {
      token = '';
      sessionReady = false;
      localStorage.removeItem(TOKEN_KEY);
      changeModal.hidden = true;
      editorModal.hidden = true;
      editingBusId = '';
      showLogin();
    }
    function apiHeaders() {
      const headers = {'Accept': 'application/json'};
      if (token) headers['X-Admin-Token'] = token;
      return headers;
    }
    function jsonHeaders() {
      return Object.assign({'Content-Type': 'application/json'}, apiHeaders());
    }
    function showLogin() {
      mainApp.hidden = true;
      loginModal.hidden = false;
      document.getElementById('loginPass').focus();
    }
    function applyPasswordManaged() {
      document.getElementById('changePassBtn').hidden = passwordManaged;
      // 托管时连弹窗一起收掉，避免任何路径（例如 mustChange 竞态）把它弹出来。
      if (passwordManaged) changeModal.hidden = true;
    }
    function showChange(force) {
      if (passwordManaged) return;
      changeModal.hidden = false;
      if (force) document.getElementById('changeHint').textContent = '请先设置一个新的管理密码，然后继续使用。';
      else document.getElementById('changeHint').textContent = '修改后需要重新登录。';
      document.getElementById('oldPass').focus();
    }
    async function doLogin() {
      const password = document.getElementById('loginPass').value;
      const button = document.getElementById('loginBtn');
      button.disabled = true;
      try {
        const response = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password})});
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '登录失败');
        token = data.token;
        sessionReady = true;
        setError('');
        mustChange = Boolean(data.mustChange);
        passwordManaged = Boolean(data.passwordManaged);
        applyPasswordManaged();
        localStorage.setItem(TOKEN_KEY, token);
        loginModal.hidden = true;
        mainApp.hidden = false;
        document.getElementById('loginPass').value = '';
        if (mustChange && !passwordManaged) showChange(true);
        await loadDevices();
        await refreshAccess();
      } catch (error) {
        alert(error.message);
      } finally {
        button.disabled = false;
      }
    }
    async function doChange() {
      const oldPassword = document.getElementById('oldPass').value;
      const newPassword = document.getElementById('newPass').value;
      const newPassword2 = document.getElementById('newPass2').value;
      if (newPassword !== newPassword2) { alert('两次输入的新密码不一致'); return; }
      if (newPassword.length < 6) { alert('新密码至少 6 个字符'); return; }
      const button = document.getElementById('changeBtn');
      button.disabled = true;
      try {
        const response = await fetch('/api/change-password', {method: 'POST', headers: jsonHeaders(), body: JSON.stringify({oldPassword, newPassword})});
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '修改失败');
        mustChange = false;
        changeModal.hidden = true;
        document.getElementById('oldPass').value = '';
        document.getElementById('newPass').value = '';
        document.getElementById('newPass2').value = '';
        flash('密码已修改，下次登录请使用新密码');
      } catch (error) {
        alert(error.message);
      } finally {
        button.disabled = false;
      }
    }
    async function loadDevices({force = false} = {}) {
      if (!token) { showLogin(); return; }
      if (!sessionReady) { await bootstrap(); return; }
      if (loadingDevices) { if (force) pendingRefresh = true; return; }
      if (!editorModal.hidden || !changeModal.hidden) return;
      loadingDevices = true;
      refreshButton.disabled = true;
      refreshButton.textContent = '正在刷新…';
      const requestToken = token;
      try {
        const response = await fetch('/api/devices' + (showHidden ? '?includeHidden=1' : ''), {cache: 'no-store', headers: apiHeaders()});
        if (requestToken !== token) return;
        if (response.status === 401) { expireSession(); return; }
        const data = await response.json();
        if (requestToken !== token) return;
        if (!response.ok || !data.ok || !Array.isArray(data.devices)) throw new Error(data.error || '读取设备失败');
        document.getElementById('port').textContent = data.usbipPort;
        document.getElementById('kickIdle').textContent = formatKickIdle(data.kickIdleSeconds);
        currentDevices = data.devices;
        hasDevices = true;
        renderDevices(currentDevices);
        document.getElementById('updated').textContent = '最近更新 ' + new Date().toLocaleTimeString('zh-CN', {hour12: false});
        setError('');
      } catch (error) {
        if (requestToken !== token) return;
        setError((hasDevices ? '刷新失败，已保留上次设备列表。' : '暂时无法读取设备。') + error.message);
        if (!hasDevices) {
          document.getElementById('count').textContent = '等待连接';
          content.innerHTML = '<div class="empty">尚未载入设备，请重试连接。</div>';
        }
      } finally {
        loadingDevices = false;
        refreshButton.disabled = false;
        refreshButton.textContent = '刷新设备';
        if (pendingRefresh) {
          pendingRefresh = false;
          await loadDevices();
        }
      }
    }
    // 失联释放时长由服务端给（应用设置里的 kick_idle_seconds），页面不再写死数字。
    function formatKickIdle(seconds) {
      const value = Number(seconds);
      if (!Number.isFinite(value) || value <= 0) return '不自动释放（0 秒）';
      if (value < 60) return `约 ${value} 秒`;
      const minutes = value / 60;
      return `约 ${Number.isInteger(minutes) ? minutes : minutes.toFixed(1)} 分钟`;
    }
    // ---- 访问控制（共享访问密码）----
    // 服务端启用了 USBIP_ACCESS_PASSWORD 时，Windows 客户端必须先用它换取授权，
    // 之后它发起的 USB/IP 数据连接才会被单端口网关放行。这一栏只做展示与吊销。
    const accessModal = document.getElementById('accessModal');
    const accessList = document.getElementById('accessList');
    function formatAccessExpiry(seconds) {
      const value = Number(seconds);
      if (!Number.isFinite(value) || value <= 0) return '已过期';
      if (value < 3600) return `${Math.ceil(value / 60)} 分钟后`;
      return `${(value / 3600).toFixed(1)} 小时后`;
    }
    function renderAccess(data) {
      const clients = Array.isArray(data.clients) ? data.clients : [];
      document.getElementById('accessState').textContent = data.required
        ? `已启用 · ${clients.length} 台已授权`
        : '未启用';
      if (!clients.length) {
        accessList.innerHTML = `<div class="empty">${data.required ? '当前没有已授权的客户端。' : '未启用访问密码，所以没有授权记录。'}</div>`;
        return;
      }
      accessList.innerHTML = clients.map(item => `
        <div class="access-row">
          <div>
            <strong>${escapeHtml(item.clientName || '未命名客户端')}</strong>
            <small>${escapeHtml(item.address || '地址未知')} · 到期 ${escapeHtml(formatAccessExpiry(item.expiresInSeconds))}</small>
          </div>
          <button class="danger" data-revoke="${escapeHtml(item.address || '')}">吊销</button>
        </div>`).join('');
      accessList.querySelectorAll('button[data-revoke]').forEach(button => {
        button.onclick = () => revokeAccess(button.dataset.revoke, button);
      });
    }
    async function refreshAccess() {
      try {
        const response = await fetch('/api/access/clients', {cache: 'no-store', headers: apiHeaders()});
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '暂时无法读取访问控制状态');
        renderAccess(data);
      } catch (error) {
        document.getElementById('accessState').textContent = '暂时无法读取';
        accessList.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }
    async function revokeAccess(address, button) {
      const question = address
        ? `确定吊销 ${address} 的访问授权吗？它需要重新输入访问密码才能连接。`
        : '确定吊销全部已授权客户端吗？它们都需要重新输入访问密码。';
      if (!window.confirm(question)) return;
      button.disabled = true;
      try {
        const response = await fetch('/api/access/clients/revoke', {
          method: 'POST', headers: jsonHeaders(), body: JSON.stringify(address ? {address} : {})
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '吊销失败');
        flash(data.message || '已吊销');
        renderAccess(data);
      } catch (error) {
        alert(error.message);
      } finally {
        button.disabled = false;
      }
    }
    document.getElementById('accessManageBtn').onclick = () => {
      accessModal.hidden = false;
      refreshAccess();
    };
    document.getElementById('accessClose').onclick = () => { accessModal.hidden = true; };
    document.getElementById('accessRevokeAll').onclick = () =>
      revokeAccess('', document.getElementById('accessRevokeAll'));

    function connectionSummary(connections) {
      if (!connections || !connections.length) return '<span class="muted">未登记连接方</span>';
      return connections.map(connection => {
        const name = escapeHtml(connection.name || '未命名客户端');
        const address = escapeHtml(connection.address || '地址未知');
        // 客户端上报的公网 IP(若它没能查到,则只显示服务端看到的来源地址)。
        const publicIp = escapeHtml(connection.publicIp || '');
        const ipLine = publicIp && publicIp !== address ? `<small>公网 ${publicIp}</small>` : '';
        return `<div class="owner"><strong>${name}</strong><small>${address}</small>${ipLine}</div>`;
      }).join('');
    }
    // 等待名单并进「占用与排队」一列：单独占一列时几乎永远是空的，白占宽度。
    // 第一行就是设备一空下来会立刻被唤醒的那一位。
    function queueSummary(pending) {
      if (!pending || !pending.length) return '';
      const names = pending.map((entry, index) => {
        const name = escapeHtml(entry.name || '未命名客户端');
        return index === 0 ? `${name}（下一位）` : `${name}（第 ${index + 1} 位）`;
      }).join('、');
      return `<div class="device-sub">排队：${names}</div>`;
    }
    function renderDevices(devices) {
      if (!editorModal.hidden || !changeModal.hidden || !accessModal.hidden || !hasDevices) return;
      const connectedCount = devices.filter(device => device.connections && device.connections.length).length;
      document.getElementById('totalCount').textContent = devices.length;
      document.getElementById('sharedCount').textContent = devices.filter(device => device.shared).length;
      document.getElementById('connectedCount').textContent = connectedCount;
      const query = searchInput.value.trim().toLocaleLowerCase();
      const filter = statusFilter.value;
      const visibleDevices = devices.filter(device => {
        const connected = Boolean(device.connections && device.connections.length);
        if (filter === 'shared' && !device.shared) return false;
        if (filter === 'unshared' && device.shared) return false;
        if (filter === 'connected' && !connected) return false;
        const owners = (device.connections || []).flatMap(connection => [connection.name, connection.address]);
        const waiters = (device.pendingQueue || []).map(entry => entry.name);
        return [device.alias, device.description, device.remark, device.busid, device.vidpid, device.bindingLabel, ...owners, ...waiters]
          .join(' ').toLocaleLowerCase().includes(query);
      });
      document.getElementById('count').textContent = `显示 ${visibleDevices.length} / ${devices.length} 个`;
      document.getElementById('clearFilters').hidden = !query && filter === 'all';
      if (!visibleDevices.length) {
        const message = devices.length ? '没有匹配的设备。' : '没有发现 USB 设备。';
        const html = `<div class="empty">${message}</div>`;
        if (renderedHtml !== html) { content.innerHTML = html; renderedHtml = html; }
        return;
      }
      const rows = visibleDevices.map(device => {
        const shared = Boolean(device.shared);
        const hidden = Boolean(device.hidden);
        const busidAttr = escapeHtml(device.busid);
        // 导出网络接口的设备 = USB 网卡。共享它会把宿主自己的网卡绑走 → NAS 掉线，
        // 所以服务端会拒绝，这里也不再给可点的按钮（避免用户以为点了有用）。
        const netIfaces = Array.isArray(device.networkInterfaces) ? device.networkInterfaces : [];
        const isNetdev = netIfaces.length > 0;
        const netHint = isNetdev
          ? `这块设备导出了网络接口（${netIfaces.join('、')}），共享它会让飞牛自己掉线，服务端已禁止共享`
          : '';
        const kick = shared
          ? `<button class="danger" data-action="kick" data-busid="${busidAttr}">强制断开</button>`
          : '';
        let action;
        if (isNetdev) {
          action = `<button class="secondary" disabled title="${escapeHtml(netHint)}">开始共享</button>`;
        } else if (shared) {
          action = `<button class="danger" data-action="unshare" data-busid="${busidAttr}">停止共享</button>${kick}`;
        } else {
          action = `<button class="primary" data-action="share" data-busid="${busidAttr}">开始共享</button>`;
        }
        const hideButton = hidden
          ? `<button class="secondary" data-action="unhide" data-busid="${busidAttr}">取消隐藏</button>`
          : `<button class="secondary" data-action="hide" data-busid="${busidAttr}">隐藏</button>`;
        const alias = device.alias ? `<div class="device-name">${escapeHtml(device.alias)}</div><div class="device-sub">系统名称：${escapeHtml(device.description || '未知')}</div>`
          : `<div class="device-name">${escapeHtml(device.description || '未知 USB 设备')}</div>`;
        // 文案由服务端给出（含真实序号），这里只负责配色；未知取值回退到“未设置”。
        const bindStyles = {
          serial: 'bind-serial', model: 'bind-model', group: 'bind-group',
          legacy: 'bind-legacy', none: 'bind-none'
        };
        const bindStyle = bindStyles[device.binding] || 'bind-none';
        const bindText = device.bindingLabel || '未设置';
        const bindBadge = `<span class="bind ${bindStyle}" title="名称/备注的识别依据">${escapeHtml(bindText)}</span>`;
        const dupHint = device.duplicateModel
          ? '<div class="device-sub warn-text">同型号多台且无序列号，无法区分个体</div>'
          : '';
        return `<tr class="${hidden ? 'row-hidden' : ''}">
          <td>${alias}<div class="device-sub">VID/PID：${escapeHtml(device.vidpid)}</div>${device.remark ? `<div class="device-sub">备注：${escapeHtml(device.remark)}</div>` : ''}${dupHint}${isNetdev ? `<div class="device-sub warn-text">网络接口：${escapeHtml(netIfaces.join('、'))}</div>` : ''}</td>
          <td><code>${escapeHtml(device.busid)}</code></td>
          <td>${bindBadge}</td>
          <td>${connectionSummary(device.connections)}${queueSummary(device.pendingQueue)}</td>
          <td><span class="badge ${shared ? 'shared' : 'free'}">${shared ? '● 已共享' : '○ 未共享'}</span>${isNetdev ? '<span class="badge net-badge">系统网卡·不可共享</span>' : ''}${hidden ? '<span class="badge hidden-badge">已隐藏</span>' : ''}</td>
          <td><div class="actions"><button class="secondary" data-action="edit" data-busid="${busidAttr}">编辑名称</button>${action}${hideButton}</div></td>
        </tr>`;
      }).join('');
      const html = `<table><thead><tr><th>设备（显示名称）</th><th>Bus ID</th><th>名称绑定依据</th><th>占用与排队</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
      // 心跳时间戳不参与页面内容比较，未变化时不替换表格，保留焦点和滚动位置。
      if (renderedHtml === html) return;
      const scrollLeft = content.scrollLeft;
      content.innerHTML = html;
      content.scrollLeft = scrollLeft;
      renderedHtml = html;
      content.querySelectorAll('button[data-action]').forEach(button => {
        button.onclick = () => {
          if (button.dataset.action === 'edit') openEditor(button.dataset.busid, devices);
          else changeState(button.dataset.busid, button.dataset.action, button);
        };
      });
    }
    function closeEditor() {
      if (document.getElementById('saveEdit').disabled) return;
      editorModal.hidden = true;
      editingBusId = '';
      renderDevices(currentDevices);
    }
    function openEditor(busid, devices) {
      const device = devices.find(item => item.busid === busid);
      if (!device) return;
      editingBusId = busid;
      aliasInput.value = device.alias || '';
      remarkInput.value = device.remark || '';
      editorModal.hidden = false;
      aliasInput.focus();
    }
    async function saveMetadata() {
      if (!editingBusId) return;
      const saveButton = document.getElementById('saveEdit');
      saveButton.disabled = true;
      try {
        const response = await fetch(`/api/devices/${encodeURIComponent(editingBusId)}/metadata`, {
          method: 'POST', headers: jsonHeaders(),
          body: JSON.stringify({alias: aliasInput.value, remark: remarkInput.value})
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || data.message || '保存失败');
        editorModal.hidden = true;
        editingBusId = '';
        flash('设备名称和备注已保存');
        await loadDevices({force: true});
      } catch (error) {
        alert(error.message);
      } finally {
        saveButton.disabled = false;
      }
    }
    async function changeState(busid, action, button) {
      if (action === 'kick' && !window.confirm('确定要从服务器强制断开此设备的远程客户端吗？设备会继续保持共享，设置了自动重连的客户端可能再次连接。')) return;
      if (action === 'hide' && !window.confirm('隐藏后该设备不会再出现在设备列表和 Windows 客户端里，也无法被共享。如果它正在共享，会先停止共享。\n\n适合用来保护 NAS 自带的 USB 网卡这类不能外放的设备。确定隐藏吗？')) return;
      button.disabled = true;
      try {
        const response = await fetch(`/api/devices/${encodeURIComponent(busid)}/${action}`, {
          method: 'POST', headers: apiHeaders()
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || data.message || '操作失败');
        flash(data.message || '操作成功');
        await loadDevices({force: true});
      } catch (error) {
        alert(error.message);
      } finally {
        button.disabled = false;
      }
    }
    async function bootstrap() {
      if (!token) { showLogin(); return; }
      if (checkingSession) return;
      checkingSession = true;
      const requestToken = token;
      try {
        const response = await fetch('/api/session', {cache: 'no-store', headers: apiHeaders()});
        if (requestToken !== token) return;
        if (response.status === 401) { expireSession(); return; }
        const data = await response.json();
        if (requestToken !== token) return;
        if (!response.ok || !data.ok || typeof data.authorized !== 'boolean') throw new Error('暂时无法验证登录状态');
        if (!data.authorized) { expireSession(); return; }
        sessionReady = true;
        mustChange = Boolean(data.mustChange);
        passwordManaged = Boolean(data.passwordManaged);
        applyPasswordManaged();
        loginModal.hidden = true;
        mainApp.hidden = false;
        setError('');
        if (mustChange && !passwordManaged) showChange(true);
        await loadDevices();
        await refreshAccess();
      } catch (error) {
        if (requestToken !== token) return;
        // 断网、服务端错误或响应损坏不代表令牌失效；保留令牌等待重试。
        loginModal.hidden = true;
        mainApp.hidden = false;
        setError('暂时无法连接服务器，登录信息已保留。请重试。');
        document.getElementById('count').textContent = '等待连接';
        if (!hasDevices) content.innerHTML = '<div class="empty">尚未载入设备，请重试连接。</div>';
      } finally {
        checkingSession = false;
      }
    }
    bootstrap();
    setInterval(() => {
      if (document.hidden || !loginModal.hidden || !editorModal.hidden || !changeModal.hidden) return;
      if (sessionReady) loadDevices();
      else bootstrap();
    }, 10000);
  </script>
</body>
</html>
